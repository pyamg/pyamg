name: Check Windows sdist build (issue #476)

on:
  push:
    branches: [check_win]
  workflow_dispatch:

jobs:
  sdist_install:
    name: py${{ matrix.python }} / ${{ matrix.setup-args || 'default' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
        setup-args: ['', '--vsenv']
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Show compilers on PATH
        run: |
          which gcc g++ c++ cl || true
          gcc --version || true

      - name: Build and install pyamg 5.4.0 from the PyPI sdist
        run: |
          args=(-v --no-cache-dir --no-binary pyamg pyamg==5.4.0)
          if [ -n "${{ matrix.setup-args }}" ]; then
            args+=(-Csetup-args=${{ matrix.setup-args }})
          fi
          python -m pip install "${args[@]}" 2>&1 | tee build.log
          echo "---- compiler/linker chosen by meson ----"
          grep -iE "compiler for the host|linker for the host" build.log || true

      - name: Show DLL dependencies of the extension modules
        run: |
          site=$(python -c 'import sysconfig; print(sysconfig.get_paths()["platlib"])')
          ls -la "$site/pyamg/amg_core"/*.pyd
          objdump -p "$site/pyamg/amg_core"/evolution_strength*.pyd | grep "DLL Name" || true

      - name: Import pyamg
        working-directory: ${{ runner.temp }}
        run: python -c "import pyamg; print(pyamg.__version__)"
